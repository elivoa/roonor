<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roon Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="pet" aria-label="桌面宠物">
        <div class="pet-cover" id="pet-cover" aria-label="打开专辑海报" title="打开专辑海报">
          <span class="roon-mark">ROON</span>
        </div>
      </section>

      <section class="panel" id="panel" aria-label="打开播放信息" title="打开播放信息">
        <header class="dragbar">
          <div>
            <p class="zone" id="zone">192.168.11.100</p>
            <p class="status" id="status">启动中</p>
          </div>
          <button class="close" id="close" title="关闭" aria-label="关闭">×</button>
        </header>

        <section class="now-playing">
          <p class="title" id="title">Roon Monitor</p>
          <p class="artist" id="artist"></p>
          <p class="album" id="album"></p>
        </section>

        <footer class="controls">
          <button id="previous" title="上一首" aria-label="上一首">‹</button>
          <button class="play" id="playpause" title="播放/暂停" aria-label="播放/暂停">▶</button>
          <button id="next" title="下一首" aria-label="下一首">›</button>
          <button class="toggle-lyrics active" id="toggle-lyrics" title="桌面歌词" aria-label="桌面歌词">
            词
          </button>
        </footer>

        <p class="file-location" id="file-location" title="Roon API 未提供音频文件路径">
          文件位置：Roon API 未提供
        </p>
      </section>

      <section class="spectrum-panel" aria-label="打开大频谱图" title="打开大频谱图">
        <header class="spectrum-header">
          <span id="spectrum-track">SPECTROGRAM</span>
          <span id="spectrum-mode">WAITING PCM</span>
        </header>
        <canvas id="spectrum" width="760" height="440" aria-label="实时频谱图"></canvas>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
